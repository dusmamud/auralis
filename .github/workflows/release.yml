name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/Auralis-${{ github.ref_name }}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: Auralis ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎵 Auralis ${{ github.ref_name }} - Initial Production Release
            High-performance client-side extractor, embedded Media3 offline player, and lossless media manager for Android.

            ### ✨ Key Highlights:
            - **100% Client-Side Engine**: Powered by embedded Chaquopy (Python 3.10) running `yt-dlp` and `mutagen` on-device. Zero server reliance.
            - **Lossless Audio Extraction**: Direct raw stream grabbing and transcoding to MP3 (up to 320 kbps), M4A, FLAC, and Opus.
            - **Automated Metadata & ID3 Tagging**: Embedded high-resolution album artwork, track title, artist, and album name.
            - **4K UHD & HD Video Downloader**: High-definition video downloading up to 4K / 1080p 60FPS remuxed to standard MP4 with Scoped Storage indexing in `Movies/Auralis`.
            - **Built-in Offline Media Player**:
              - **Audio Player**: Background playback backed by AndroidX Media3 `MediaSessionService` with lockscreen controls.
              - **Offline Video Player**: Gestural video player with vertical brightness/volume swipes, double-tap seek, and aspect ratio scaling.
            - **In-App Dynamic Engine Updater**: Hot-update `yt-dlp` wheels directly from Settings without waiting for new APK releases.
            - **Pure Jetpack Compose UI**: Designed to specification with dark theme aesthetics, zero-shadow chrome, and responsive orientation handling.

            ---
            ### 📦 Installation
            Download the `Auralis-${{ github.ref_name }}.apk` asset below and install it on your device running Android 8.0+ (API 26+).
          files: |
            release-artifacts/Auralis-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
